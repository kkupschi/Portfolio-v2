<section class="why" id="why">
    <div class="container why__inner">

        <h2 class="why__headline section-title">{{ lang.t().whyMe.title }}</h2>

        <div class="why__content">

            <div class="why__location">
                <img class="why__location-icon" src="/assets/ui/location.png" alt="" />
                <p class="why__location-text">
                    {{ lang.t().whyMe.locationPrefix }} <span>{{ lang.t().whyMe.city }}</span>
                </p>
            </div>

            <div class="why__text">
                <h3>{{ lang.t().whyMe.heading }}</h3>
                <p>{{ lang.t().whyMe.text }}</p>

                <a class="why__cta" href="#contact" aria-label="Go to contact section">
                    <img src="/assets/ui/lets-talk.png" alt="Let's talk" />
                </a>
            </div>
        </div>
    </div>
</section>
